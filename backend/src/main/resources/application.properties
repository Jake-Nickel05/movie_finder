server.port = 8080

#spring.datasource.url=jdbc:mysql://localhost:3306/testSchema?useSSL=false

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moviefinder?useSSL=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
tmdb.api.key=${TMDB_API_KEY}
spring.main.allow-bean-definition-overriding=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/docs/swagger-ui-custom.html
